debug=false
spring.application.name=archemides

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=Archemides
info.app.description=Forex backtesting and quantitative analytics lab
info.app.java-target=21

logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
